spring:
  application:
    name: shortly-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/shortly}
    username: ${SPRING_DATASOURCE_USERNAME:shortly}
    password: ${SPRING_DATASOURCE_PASSWORD:shortly}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
server:
  port: ${SERVER_PORT:8080}
app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  rate-limit:
    capacity: ${RATE_LIMIT_CAPACITY:30}
    refill-per-second: ${RATE_LIMIT_REFILL_PER_SECOND:1}
management:
  endpoints:
    web:
      exposure:
        include: health,info
